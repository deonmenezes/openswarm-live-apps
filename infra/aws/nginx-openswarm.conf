server {
    server_name 54-166-194-87.sslip.io _;

    # Trailing slash on proxy_pass strips the /estate prefix, so /estate/api/x
    # reaches the backend as /api/x and the app code needs no path awareness.
    location /estate/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events die if the proxy buffers them; this is the same
        # failure Cloudflare's tunnel had, so do not repeat it here.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /churn/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = / { return 200 'openswarm api\n'; add_header Content-Type text/plain; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/54-166-194-87.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/54-166-194-87.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = 54-166-194-87.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name 54-166-194-87.sslip.io _;
    return 404; # managed by Certbot


}